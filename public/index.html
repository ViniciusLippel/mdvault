<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mdvault</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-width: 220px;
      --topbar-height: 42px;
      --bg: #ffffff;
      --sidebar-bg: #f7f7f5;
      --border: #e8e8e6;
      --text: #1a1a1a;
      --text-muted: #999;
      --text-sidebar: #444;
      --accent: #1a1a1a;
      --hover: #efefed;
      --active: #e8e8e5;
      --btn-border: #d0d0ce;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      grid-template-rows: var(--topbar-height) 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Topbar ── */
    #topbar {
      grid-column: 1 / 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #app-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    #breadcrumb {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #breadcrumb span { cursor: pointer; }
    #breadcrumb span:hover { color: var(--text); }
    #breadcrumb .sep { color: var(--border); }

    /* ── Mode toggle ── */
    #mode-toggle {
      display: flex;
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      overflow: hidden;
    }

    #mode-toggle button {
      padding: 4px 12px;
      font-size: 12px;
      font-family: var(--font);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.12s, color 0.12s;
      letter-spacing: 0.01em;
    }

    #mode-toggle button:first-child { border-right: 1px solid var(--btn-border); }

    #mode-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Sidebar ── */
    #sidebar {
      border-right: 1px solid var(--border);
      background: var(--sidebar-bg);
      overflow-y: auto;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
    }

    #sidebar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }

    #sidebar-actions button {
      background: none;
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-family: var(--font);
      cursor: pointer;
      color: var(--text-sidebar);
      transition: background 0.1s;
    }

    #sidebar-actions button:hover { background: var(--hover); }

    .tree-node { user-select: none; }

    .tree-folder-label,
    .tree-file-label {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      cursor: pointer;
      color: var(--text-sidebar);
      font-size: 13px;
      border-radius: 4px;
      margin: 1px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-folder-label:hover,
    .tree-file-label:hover { background: var(--hover); }

    .tree-file-label.active {
      background: var(--active);
      color: var(--text);
      font-weight: 500;
    }

    .tree-folder-label .icon,
    .tree-file-label .icon {
      font-size: 12px;
      flex-shrink: 0;
      opacity: 0.55;
    }

    .tree-folder-label .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .tree-file-label .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }

    .tree-folder-label .chevron {
      font-size: 9px;
      opacity: 0.4;
      transition: transform 0.15s;
    }

    .tree-folder-label.open .chevron { transform: rotate(90deg); }

    .tree-children { display: none; }
    .tree-children.open { display: block; }

    .tree-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 16px 4px;
    }

    /* ── Context menu ── */
    #context-menu {
      position: fixed;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 4px;
      z-index: 1000;
      min-width: 140px;
      display: none;
    }

    #context-menu.visible { display: block; }

    .ctx-item {
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      color: var(--text);
    }

    .ctx-item:hover { background: var(--hover); }
    .ctx-item.danger { color: #c0392b; }

    /* ── Main content ── */
    #main {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
    }

    #empty-state .hint { font-size: 13px; }

    /* ── Rendered view ── */
    #rendered-view {
      flex: 1;
      overflow-y: auto;
      padding: 48px 64px;
      display: none;
    }

    #rendered-view.visible { display: block; }

    .md-content {
      max-width: 680px;
      margin: 0 auto;
    }

    .md-content h1 { font-size: 24px; font-weight: 600; margin-bottom: 20px; line-height: 1.3; }
    .md-content h2 { font-size: 18px; font-weight: 600; margin: 28px 0 10px; }
    .md-content h3 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; }
    .md-content h4, .md-content h5, .md-content h6 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }

    .md-content p { margin-bottom: 14px; line-height: 1.7; }
    .md-content ul, .md-content ol { margin: 0 0 14px 22px; }
    .md-content li { margin-bottom: 4px; line-height: 1.7; }

    .md-content a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .md-content a:hover { opacity: 0.6; }

    .md-content code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: #f4f4f2;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .md-content pre {
      background: #f4f4f2;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .md-content pre code { background: none; padding: 0; font-size: 12.5px; }

    .md-content blockquote {
      border-left: 3px solid var(--border);
      padding-left: 16px;
      margin: 0 0 14px;
      color: #666;
    }

    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .md-content table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13px; }
    .md-content th { font-weight: 600; border-bottom: 2px solid var(--border); padding: 6px 12px; text-align: left; }
    .md-content td { border-bottom: 1px solid var(--border); padding: 6px 12px; }

    .md-content img { max-width: 100%; border-radius: 4px; }

    /* ── Edit view ── */
    #edit-view {
      flex: 1;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    #edit-view.visible { display: flex; }

    #editor-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 48px 64px;
      display: flex;
      flex-direction: column;
    }

    #editor {
      flex: 1;
      display: block;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      resize: none;
      border: none;
      outline: none;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
      background: var(--bg);
      tab-size: 2;
    }

    #editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    #save-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 11px;
      font-family: var(--font);
      cursor: pointer;
      transition: opacity 0.1s;
    }

    #save-btn:disabled { opacity: 0.35; cursor: default; }
    #save-btn:not(:disabled):hover { opacity: 0.8; }

    /* ── Modal ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.15);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    #modal-overlay.visible { display: flex; }

    #modal {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }

    #modal h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }

    #modal input {
      width: 100%;
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      margin-bottom: 12px;
    }

    #modal input:focus { border-color: #aaa; }

    #modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    #modal-actions button {
      padding: 5px 14px;
      font-size: 12px;
      font-family: var(--font);
      border-radius: 5px;
      cursor: pointer;
    }

    #modal-cancel {
      background: none;
      border: 1px solid var(--btn-border);
      color: var(--text);
    }

    #modal-confirm {
      background: var(--accent);
      border: none;
      color: #fff;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #bbb; }
  </style>
</head>
<body>
<div id="app">
  <!-- Topbar -->
  <div id="topbar">
    <div id="topbar-left">
      <span id="app-title">mdvault</span>
      <div id="breadcrumb"></div>
    </div>
    <div id="mode-toggle">
      <button id="btn-rendered" class="active" onclick="setMode('rendered')">Rendered</button>
      <button id="btn-edit" onclick="setMode('edit')">Edit</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-actions">
      <button onclick="promptCreate('file')">+ Note</button>
      <button onclick="promptCreate('folder')">+ Folder</button>
    </div>
    <div id="tree-root"></div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="empty-state">
      <span style="font-size:24px; opacity:0.2">◻</span>
      <span class="hint">Select a note or create one</span>
    </div>
    <div id="rendered-view"><div class="md-content" id="rendered-content"></div></div>
    <div id="edit-view">
      <div id="editor-wrap">
        <textarea id="editor" spellcheck="false" placeholder="Start writing…"></textarea>
      </div>
      <div id="editor-footer">
        <span id="word-count">0 words</span>
        <button id="save-btn" disabled onclick="saveFile()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Context menu -->
<div id="context-menu">
  <div class="ctx-item" id="ctx-rename">Rename</div>
  <div class="ctx-item danger" id="ctx-delete">Delete</div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">New note</h3>
    <input id="modal-input" type="text" autocomplete="off" />
    <div id="modal-actions">
      <button id="modal-cancel" onclick="closeModal()">Cancel</button>
      <button id="modal-confirm" onclick="confirmModal()">Create</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let currentFile = null;  // vault-relative path e.g. "folder/note.md"
let currentFolder = '';  // current folder context for new files/folders
let mode = 'rendered';
let dirty = false;
let modalAction = null;
let ctxTarget = null;

// ── API helpers ──
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

// ── Tree ──
async function loadTree() {
  const tree = await api('GET', '/api/tree');
  renderTree(tree, document.getElementById('tree-root'));
}

function renderTree(nodes, container) {
  container.innerHTML = '';
  if (!nodes.length) {
    container.innerHTML = '<div style="padding:8px 16px; font-size:12px; color:#bbb">Empty vault</div>';
    return;
  }
  for (const node of nodes) {
    container.appendChild(createNode(node, 0));
  }
}

function createNode(node, depth) {
  const el = document.createElement('div');
  el.className = 'tree-node';
  el.style.paddingLeft = depth * 12 + 'px';

  if (node.type === 'folder') {
    const label = document.createElement('div');
    label.className = 'tree-folder-label';
    label.innerHTML = `<span class="chevron">▶</span><span class="icon">▫</span><span class="name">${esc(node.name)}</span>`;
    label.dataset.path = node.path;

    const children = document.createElement('div');
    children.className = 'tree-children';

    label.addEventListener('click', () => {
      label.classList.toggle('open');
      children.classList.toggle('open');
      currentFolder = node.path;
    });

    label.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e, node);
    });

    for (const child of node.children) {
      children.appendChild(createNode(child, depth + 1));
    }

    el.appendChild(label);
    el.appendChild(children);
  } else {
    const label = document.createElement('div');
    label.className = 'tree-file-label';
    label.innerHTML = `<span class="icon">◻</span><span class="name">${esc(node.name)}</span>`;
    label.dataset.path = node.path;

    if (currentFile === node.path) label.classList.add('active');

    label.addEventListener('click', () => openFile(node.path));
    label.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e, node);
    });

    el.appendChild(label);
  }

  return el;
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Open file ──
async function openFile(filePath) {
  if (dirty && !confirm('Discard unsaved changes?')) return;

  currentFile = filePath;
  currentFolder = filePath.includes('/') ? filePath.split('/').slice(0, -1).join('/') : '';
  dirty = false;

  const data = await api('GET', `/api/file?path=${encodeURIComponent(filePath)}`);
  if (data.error) { alert('Could not open file: ' + data.error); return; }

  document.getElementById('editor').value = data.content;
  updateSaveBtn();
  updateWordCount(data.content);
  renderMarkdown(data.content);
  updateBreadcrumb(filePath);
  highlightActive(filePath);

  document.getElementById('empty-state').style.display = 'none';
  applyMode(mode);
}

function renderMarkdown(text) {
  document.getElementById('rendered-content').innerHTML = marked.parse(text);
}

function updateBreadcrumb(filePath) {
  const parts = filePath.replace(/\.md$/, '').split('/');
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    return isLast
      ? `<span style="color:var(--text-sidebar)">${esc(p)}</span>`
      : `<span>${esc(p)}</span><span class="sep">/</span>`;
  }).join('');
}

function highlightActive(filePath) {
  document.querySelectorAll('.tree-file-label').forEach(el => {
    el.classList.toggle('active', el.dataset.path === filePath);
  });
  // Ensure parent folders are open
  const parts = filePath.split('/');
  let current = '';
  for (let i = 0; i < parts.length - 1; i++) {
    current = current ? current + '/' + parts[i] : parts[i];
    const folderLabel = document.querySelector(`.tree-folder-label[data-path="${CSS.escape(current)}"]`);
    if (folderLabel && !folderLabel.classList.contains('open')) {
      folderLabel.classList.add('open');
      folderLabel.nextElementSibling.classList.add('open');
    }
  }
}

// ── Mode ──
function setMode(m) {
  mode = m;
  document.getElementById('btn-rendered').classList.toggle('active', m === 'rendered');
  document.getElementById('btn-edit').classList.toggle('active', m === 'edit');
  if (currentFile) applyMode(m);
}

function applyMode(m) {
  const rendered = document.getElementById('rendered-view');
  const edit = document.getElementById('edit-view');
  if (m === 'rendered') {
    renderMarkdown(document.getElementById('editor').value);
    rendered.classList.add('visible');
    edit.classList.remove('visible');
  } else {
    rendered.classList.remove('visible');
    edit.classList.add('visible');
  }
}

// ── Editor ──
document.getElementById('editor').addEventListener('input', () => {
  dirty = true;
  updateSaveBtn();
  updateWordCount(document.getElementById('editor').value);
});

document.getElementById('editor').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    ta.value = ta.value.slice(0, start) + '  ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = start + 2;
  }
});

function updateSaveBtn() {
  document.getElementById('save-btn').disabled = !dirty;
}

function updateWordCount(text) {
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = `${words} word${words !== 1 ? 's' : ''}`;
}

async function saveFile() {
  if (!currentFile || !dirty) return;
  const content = document.getElementById('editor').value;
  const res = await api('PUT', '/api/file', { path: currentFile, content });
  if (res.error) { alert('Save failed: ' + res.error); return; }
  dirty = false;
  updateSaveBtn();
}

// ── Context menu ──
function showContextMenu(e, node) {
  ctxTarget = node;
  const menu = document.getElementById('context-menu');
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('visible');
}

document.addEventListener('click', () => {
  document.getElementById('context-menu').classList.remove('visible');
});

document.getElementById('ctx-rename').addEventListener('click', () => {
  if (!ctxTarget) return;
  openModal('Rename', ctxTarget.name, async (newName) => {
    if (!newName) return;
    const isFile = ctxTarget.type === 'file';
    const parts = ctxTarget.path.split('/');
    parts[parts.length - 1] = isFile ? newName + '.md' : newName;
    const newPath = parts.join('/');
    await api('POST', '/api/rename', {
      oldPath: ctxTarget.path,
      newPath,
    });
    if (currentFile === ctxTarget.path) {
      currentFile = newPath;
      updateBreadcrumb(newPath);
    }
    loadTree();
  });
});

document.getElementById('ctx-delete').addEventListener('click', async () => {
  if (!ctxTarget) return;
  if (!confirm(`Delete "${ctxTarget.name}"? This cannot be undone.`)) return;
  await api('DELETE', `/api/file?path=${encodeURIComponent(ctxTarget.path)}`);
  if (ctxTarget.type === 'file' && currentFile === ctxTarget.path) {
    currentFile = null;
    dirty = false;
    document.getElementById('editor').value = '';
    document.getElementById('rendered-content').innerHTML = '';
    document.getElementById('breadcrumb').innerHTML = '';
    document.getElementById('empty-state').style.display = '';
    document.getElementById('rendered-view').classList.remove('visible');
    document.getElementById('edit-view').classList.remove('visible');
  }
  loadTree();
});

// ── Create ──
function promptCreate(type) {
  const inFolder = currentFolder ? ` in ${currentFolder}` : '';
  if (type === 'file') {
    openModal(`New note${inFolder}`, '', async (name) => {
      if (!name) return;
      const filePath = currentFolder ? `${currentFolder}/${name}` : name;
      const res = await api('POST', '/api/file', { path: filePath });
      if (res.error) { alert(res.error); return; }
      await loadTree();
      openFile(res.path);
      setMode('edit');
    });
  } else {
    openModal(`New folder${inFolder}`, '', async (name) => {
      if (!name) return;
      const folderPath = currentFolder ? `${currentFolder}/${name}` : name;
      const res = await api('POST', '/api/folder', { path: folderPath });
      if (res.error) { alert(res.error); return; }
      loadTree();
    });
  }
}

// ── Modal ──
function openModal(title, defaultValue, onConfirm) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-input').value = defaultValue;
  document.getElementById('modal-overlay').classList.add('visible');
  modalAction = onConfirm;
  setTimeout(() => {
    const input = document.getElementById('modal-input');
    input.focus();
    input.select();
  }, 50);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
  modalAction = null;
}

function confirmModal() {
  const val = document.getElementById('modal-input').value.trim();
  closeModal();
  if (modalAction) modalAction(val);
}

document.getElementById('modal-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') confirmModal();
  if (e.key === 'Escape') closeModal();
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ── Global shortcuts ──
document.addEventListener('keydown', (e) => {
  // Alt+A — toggle rendered/edit mode
  if (e.altKey && !e.ctrlKey && !e.metaKey && e.key === 'a') {
    e.preventDefault();
    setMode(mode === 'rendered' ? 'edit' : 'rendered');
  }
  // Ctrl+S / Cmd+S — save (works from any mode)
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
});

// ── Init ──
loadTree();
</script>
